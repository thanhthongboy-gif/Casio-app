<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay Toán THPTQG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" onerror="var m=document.createElement('script');m.async=true;m.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';document.head.appendChild(m)"></script>
<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#1D4ED8;--accent-bg:#EFF6FF;
 --k-bg:#F1F5F9;--k-line:#CBD5E1;--k-text:#0F172A;--k-shift:#FEF3C7;--k-shift-t:#92400E;--k-alpha:#FEE2E2;--k-alpha-t:#991B1B;--k-menu:#DBEAFE;--k-menu-t:#1E40AF;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:72px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);margin:0 -16px;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:700;color:var(--accent);letter-spacing:-.01em}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--accent-bg)}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{position:relative;margin:14px 0 10px}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid}
.search .si .i{width:19px;height:19px}
.search input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 42px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:none;place-items:center}
.clear .i{width:18px;height:18px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;line-height:1.3;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12.5px;color:var(--muted);margin:14px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card.open{border-color:var(--accent)}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ico{flex:none;width:38px;height:38px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700}
.ico .i{width:21px;height:21px}
.ht{flex:1;min-width:0;overflow-wrap:anywhere}
.ht b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ht span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--muted);transition:transform .2s;width:20px;height:20px}
.card.open .chev{transform:rotate(180deg);color:var(--accent)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .body{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.pad{padding:0 12px 12px}
.blk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px;overflow-x:auto}
.blk>b{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.blk.trap{border-left:3px solid var(--text)}
.blk.note{background:var(--bg)}
.prob{margin-bottom:8px}
.fm{padding:7px 0;border-top:1px solid var(--line);overflow-x:auto}
.fm:first-of-type{border-top:0;padding-top:0}
.fm small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:3px}
.st{flex:1;min-width:0;line-height:2}
kbd{display:inline-block;font:600 12.5px/1 'Be Vietnam Pro',system-ui,sans-serif;background:var(--k-bg);color:var(--k-text);border:1px solid var(--k-line);border-bottom-width:3px;border-radius:7px;padding:5px 8px 4px;margin:0 1px;white-space:nowrap}
kbd.shift{background:var(--k-shift);color:var(--k-shift-t);border-color:var(--k-shift-t)}
kbd.alpha{background:var(--k-alpha);color:var(--k-alpha-t);border-color:var(--k-alpha-t)}
kbd.menu{background:var(--k-menu);color:var(--k-menu-t);border-color:var(--k-menu-t)}
.tip{margin-top:12px;border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--accent-bg)}
.tip b{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty big{display:block;margin-bottom:6px}
.empty big .i{width:36px;height:36px}
footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
mjx-container{font-size:105%!important}
.fm mjx-container,.blk mjx-container{max-width:100%}
/* Tập bấm */
.pr{display:flex;flex-direction:column;gap:10px}
.pb2{display:flex;gap:6px}
.pbar{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pbar small{display:block;font-size:12px;color:var(--muted)}
.pbar b{color:var(--accent);font-size:15px}
.rand{width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.rand:active{opacity:.9}
.ghost{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:8px;font-weight:600;font-size:13.5px;padding:9px 12px;cursor:pointer}
.ghost:active{background:var(--accent-bg)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.pcard small{font-size:12.5px;color:var(--muted)}
.qt{font-size:16px;line-height:1.8;margin:6px 0 12px;overflow-x:auto}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pa{margin-top:10px;background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-weight:600;overflow-x:auto}
.ps{margin-top:12px}
.keys{white-space:nowrap}
.tx{margin:0 .25em}
/* Mục lục (drawer bên phải) */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(86vw,330px);background:var(--card);z-index:50;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);border-left:1px solid var(--line)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;border-bottom:1px solid var(--line);font-weight:700;color:var(--accent)}
.dx{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.dn{flex:1;overflow-y:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.dn h2{font-size:13px;font-weight:700;color:var(--accent);margin:14px 6px 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dn h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 6px 4px;font-weight:700}
.di{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font-size:14.5px;text-align:left;padding:10px;border-radius:8px;cursor:pointer}
.di.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.di .go2{margin-left:auto;width:17px;height:17px;color:var(--muted)}
@media (max-width:380px){.chips{margin:0 -12px;padding:0 12px 2px}.app{padding:0 12px 40px}header{margin:0 -12px;padding:0 12px}.blk,.fm{font-size:13px}mjx-container{font-size:98%!important}}
@media (prefers-reduced-motion:reduce){.body,.chev,.drawer,.scrim{transition:none}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Mục lục">
  <div class="dh"><span>Mục lục</span><button class="dx" id="dx" aria-label="Đóng mục lục" data-i="x"></button></div>
  <nav class="dn" id="dn"></nav>
</aside>
<div class="app">
  <header>
    <h1>Sổ tay Toán THPTQG</h1>
    <button class="icon-btn" id="burger" aria-label="Mở mục lục" data-i="menu"></button>
  </header>
  <div class="search">
    <span class="si" data-i="search"></span>
    <input id="q" type="search" placeholder="Tìm công thức, chuyên đề…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clear" aria-label="Xóa tìm kiếm" data-i="x"></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <main class="list" id="list"></main>
  <footer>Phím <kbd class="shift">SHIFT</kbd> <kbd class="alpha">ALPHA</kbd> <kbd class="menu">MENU</kbd> tô màu như trên máy. Menu có thể khác nhẹ tùy phiên bản fx-580VN X.</footer>
</div>

 {cat:'Tích phân & Nguyên hàm',q:`Hàm nào là một nguyên hàm của \\(f(x)=2xe^{x^2}\\)?<br>A. \\(e^{x^2}\\)  B. \\(x^2e^x\\)  C. \\(2e^{x^2}\\)  D. \\(e^{2x}\\)`,a:`\\text{A. }e^{x^2}`,m:`Bấm [SHIFT][∫] cho từng đáp án tại \\(x=1\\), so với \\(f(1)=2e\\approx5{,}4366\\). Đáp án nào bằng thì chọn.`,
  s:[`Nguyên hàm \\(F\\) phải thỏa \\(F'(x)=f(x)\\).`,`Đặt \\(t=x^2\\): \\(\\int2xe^{x^2}dx=\\int e^t\\,dt=e^{x^2}+C\\).`,`Kiểm tra: \\((e^{x^2})'=2xe^{x^2}\\), khớp đáp án A.`]},
 {cat:'Tích phân & Nguyên hàm',q:`Tính diện tích hình phẳng giới hạn bởi \\(y=x^2\\) và \\(y=x\\).`,a:`\\dfrac16`,m:`Bấm [∫] cận \\(0\\) đến \\(1\\) với \\(|x-x^2|\\): ra \\(0{,}1666\\).`,
  s:[`Giao điểm: \\(x^2=x\\Rightarrow x=0\\) hoặc \\(x=1\\).`,`Trên \\((0;1)\\): \\(x\\ge x^2\\).`,`\\(S=\\int_0^1(x-x^2)dx=\\dfrac12-\\dfrac13=\\dfrac16\\).`]},
 /* --- Mũ - Logarit --- */
 {cat:'Mũ - Logarit',q:`Giải phương trình \\(2^x=7\\).`,a:`x=\\log_27\\approx2{,}807`,m:`Bấm [SHIFT][CALC] (SOLVE) với \\(2^x-7\\), hoặc bấm \\(\\log7\\div\\log2\\).`,

  s:[`\\(\\log_28=3\\) vì \\(2^3=8\\).`,`\\(\\log_39=2\\) vì \\(3^2=9\\).`,`Tổng bằng \\(5\\).`]},
 {cat:'Mũ - Logarit',q:`Giải bất phương trình \\(\\log_2(x-1)\\ge3\\).`,a:`x\\ge9`,m:`Bấm [CALC] thử \\(x=9\\) (ra \\(3\\)) và \\(x=8\\) (ra nhỏ hơn \\(3\\)).`,

function keyClass(t){

  if(u==='SHIFT') return 'shift';
  if(u==='ALPHA') return 'alpha';
  if(u==='MENU'||u==='OPTN') return 'menu';
  return '';

  : `\\(\\displaystyle ${ex(x)}\\)`;

  const M = window.MathJax;
  if(M && M.typesetPromise && M.startup && M.startup.promise){

function pickQ(pool){
  if(!pool.length) return null;
  const c = pool.length>1 ? pool.filter(p=>p!==cur) : pool;   /* không lặp lại câu vừa ra */
  return c[Math.floor(Math.random()*c.length)];
}

  document.querySelectorAll('#dn .di').forEach(b=>{
    const on = !none && b.dataset.m===mode && b.dataset.c===cat && (mode==='practice' || b.dataset.g===grp);
    b.classList.toggle('on',on);
  });
}
function render(){
  const tokens = norm(q.value).split(/\s+/).filter(Boolean);
  let pool, isP = false;
  if(tokens.length) pool = REF.filter(d=>tokens.every(t=>d.hay.includes(t)));
  else if(mode==='practice'){ isP = true; pool = PRACTICE.filter(d=>cat===ALL_CAT||d.cat===cat); }
  else pool = REF.filter(d=>(grp===ALL_CAT||d.grp===grp)&&(cat===ALL_CAT||d.cat===cat));
  clearBtn.style.display = q.value ? 'grid' : 'none';
  const g = GRPS.find(x=>x[0]===grp);
  const label = isP ? 'Luyện tập' + (cat===ALL_CAT?'':' · '+esc(cat)) : cat!==ALL_CAT ? esc(cat) : (g?esc(g[1]):'Tất cả');
  countEl.innerHTML = pool.length ? (tokens.length ? `${pool.length} kết quả` : `${label} · ${pool.length} ${isP?'bài':'mục'}`) : '';
  list.innerHTML = isP ? practiceHTML(pool) : pool.length ? pool.map(cardHTML).join('') :
    `<div class="empty"><big>${ic('search')}</big>Không tìm thấy kết quả.<br>Thử từ khóa ngắn hơn, ví dụ “tổ hợp” hoặc “đạo hàm”.</div>`;
  renderChips(); markDrawer(); typeset(list);
}
function go(g,c,m){
  mode = m||'ref'; grp = g||ALL_CAT; cat = c||ALL_CAT; q.value = '';
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

chipsEl.addEventListener('click',e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  go(b.dataset.g,ALL_CAT,'ref');
});
list.addEventListener('click',e=>{
  const a = e.target.closest('[data-act]'); if(a){ act(a); return; }
  const h = e.target.closest('.head'); if(!h) return;
  const card = h.parentElement, open = !card.classList.contains('open');
  card.classList.toggle('open',open);
  h.setAttribute('aria-expanded',open);
  if(open) setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),280);
});
let tm; q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120)});
clearBtn.addEventListener('click',()=>{q.value='';render();q.focus()});

/* ---- Mục lục ☰ ---- */
function buildDrawer(){
  const cats = a => [...new Set(a.map(d=>d.cat))];
  const it = (m,g,c,l) => `<button class="di" data-m="${m}" data-g="${g}" data-c="${esc(c)}">${esc(l)}${ic('chevR','go2')}</button>`;
  const sec = ([g,l]) => `<h3>${esc(l)}</h3>`+it('ref',g,ALL_CAT,'Tất cả')+cats(REF.filter(d=>d.grp===g)).map(c=>it('ref',g,c,c)).join('');
  $('#dn').innerHTML = `<h2>Tra cứu công thức</h2>` + GRPS.slice(0,4).map(sec).join('')
    + `<h2>Máy tính &amp; luyện tập</h2>` + sec(GRPS[4])
    + `<h3>Luyện tập bấm máy</h3>` + it('practice',ALL_CAT,ALL_CAT,'Tất cả dạng bài') + cats(PRACTICE).map(c=>it('practice',ALL_CAT,c,c)).join('');
}
const setDrawer = o => { document.body.classList.toggle('dopen',o); document.body.classList.toggle('lock',o); };
$('#burger').addEventListener('click',()=>setDrawer(true));
$('#dx').addEventListener('click',()=>setDrawer(false));
$('#scrim').addEventListener('click',()=>setDrawer(false));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') setDrawer(false); });
$('#dn').addEventListener('click',e=>{
  const b = e.target.closest('.di'); if(!b) return;
  setDrawer(false);
  go(b.dataset.g,b.dataset.c,b.dataset.m);
});

buildDrawer(); render();
</script>
</body>
</html>
