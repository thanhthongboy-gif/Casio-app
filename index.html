<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Casio Master 580</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;--accent:#1f8a70;--accent-ink:#fff;
  --bg:#eef1ee;--surface:#fbfcfa;--ink:#1c2420;--muted:#66726b;--line:#dfe5e0;
  --lcd:#d3e3c8;--lcd-ink:#26402f;
  --key:#f1f4f1;--key-edge:#c5cec7;--tip:#fff4d6;--tip-ink:#6b5416;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1311;--surface:#171d1a;--ink:#e8eeea;--muted:#92a097;--line:#26302b;
    --accent:#5fd0a8;--accent-ink:#06261a;--lcd:#233229;--lcd-ink:#bfe3c9;
    --key:#222b26;--key-edge:#0b0e0c;--tip:#2c2713;--tip-ink:#e8d28f;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1311;--surface:#171d1a;--ink:#e8eeea;--muted:#92a097;--line:#26302b;
  --accent:#5fd0a8;--accent-ink:#06261a;--lcd:#233229;--lcd-ink:#bfe3c9;
  --key:#222b26;--key-edge:#0b0e0c;--tip:#2c2713;--tip-ink:#e8d28f;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--lcd);color:var(--lcd-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.5px;box-shadow:inset 0 0 0 1px var(--line)}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.sub{font-size:12px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.search{position:relative}
.search svg.s{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 44px 0 42px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.clear{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:12px;display:none;cursor:pointer;font-size:20px}
.clear.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:12.5px;color:var(--muted);margin:10px 4px 10px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:box-shadow .25s,border-color .25s}
.card.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 10px 30px -14px color-mix(in srgb,var(--accent) 45%,transparent)}
.head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.head:active{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ico{flex:none;width:48px;height:48px;border-radius:14px;background:var(--lcd);color:var(--lcd-ink);display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:inset 0 2px 0 color-mix(in srgb,#000 8%,transparent)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.txt span{font-size:12.5px;color:var(--muted)}
.chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .3s}
.card.open .chev{transform:rotate(180deg);color:var(--accent)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.card.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:2px 16px 18px}
ol{list-style:none;margin:0;padding:0;counter-reset:s}
li{counter-increment:s;position:relative;padding:10px 0 10px 40px;font-size:14.5px;border-top:1px dashed var(--line)}
li:first-child{border-top:0}
li::before{content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:8px;background:var(--lcd);color:var(--lcd-ink);font-size:12.5px;font-weight:700;display:grid;place-items:center}
kbd{display:inline-block;font:600 12.5px/1 var(--font);padding:5px 8px 6px;margin:1px 1px;border-radius:7px;background:var(--key);color:var(--ink);border:1px solid var(--key-edge);border-bottom-width:3px;white-space:nowrap}
.tip{margin-top:10px;padding:11px 13px;border-radius:14px;background:var(--tip);color:var(--tip-ink);font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px;display:none}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.foot{margin:22px 6px 0;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <div class="logo">580</div>
        <div><h1>Casio Master 580</h1><div class="sub">Sổ tay bấm phím fx-580VN X</div></div>
      </div>
      <button class="icon-btn" id="theme" aria-label="Đổi giao diện sáng hoặc tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="search">
      <svg class="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tìm: tich phan, ma tran, i, solve…" aria-label="Tìm hướng dẫn">
      <button class="clear" id="clr" aria-label="Xoá tìm kiếm">×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Lọc theo nhóm"></div>
  </header>
  <div class="count" id="count" aria-live="polite"></div>
  <main class="list" id="list"></main>
  <div class="empty" id="empty"><b>Chưa tìm thấy hướng dẫn</b>Thử từ khoá ngắn hơn, ví dụ “ma trận” hoặc “nghiệm”.</div>
  <p class="foot">Tên menu và vị trí phím có thể khác đôi chút tuỳ phiên bản máy. Hãy đối chiếu với sách hướng dẫn đi kèm.</p>
</div>
<script>
const CATS=["Tất cả","Đại số","Giải tích","Số phức","Ma trận","Thống kê"];
const D=[
{c:"Đại số",i:"x²",t:"Giải phương trình bậc 2, bậc 3",s:"Nghiệm thực và nghiệm phức",k:"phuong trinh bac hai ba nghiem delta polynomial equation",
 st:["Bấm {MENU}, chọn Phương trình/Hàm số.","Chọn Phương trình bậc n, rồi chọn bậc {2} hoặc {3}.","Nhập lần lượt hệ số a, b, c (và d), mỗi hệ số kết thúc bằng {=}.","Bấm {=} để xem nghiệm x₁, dùng {▼} {▲} xem các nghiệm còn lại.","Bấm {S⇔D} để đổi giữa dạng phân số và số thập phân."],
 tp:"Bấm {AC} để quay về bảng hệ số và sửa lại số vừa nhập."},
{c:"Đại số",i:"2x",t:"Giải hệ phương trình 2 đến 3 ẩn",s:"Hệ phương trình bậc nhất",k:"he phuong trinh an simul equation linear",
 st:["Bấm {MENU}, chọn Phương trình/Hàm số.","Chọn Hệ phương trình, sau đó chọn số ẩn {2} hoặc {3}.","Nhập hệ số từng dòng theo thứ tự a, b, c (d), mỗi số kết thúc bằng {=}.","Bấm {=} để xem x, rồi {▼} xem y và z."],
 tp:"Nếu máy báo vô nghiệm hoặc vô số nghiệm, kiểm tra lại dấu của các hệ số."},
{c:"Đại số",i:"=?",t:"SOLVE: giải phương trình bất kỳ",s:"Tìm x gần đúng bằng phương pháp lặp",k:"solve giai phuong trinh tim x an so nghiem gan dung shift calc",
 st:["Bấm {MENU}, chọn Tính toán.","Nhập vế trái, bấm {ALPHA} {CALC} để gõ dấu bằng, rồi nhập vế phải. Biến x gõ bằng {ALPHA} {)}.","Bấm {SHIFT} {CALC} để chạy SOLVE.","Nhập giá trị khởi đầu cho x rồi bấm {=}.","Máy hiện nghiệm x và hiệu hai vế (Left − Right)."],
 tp:"Hiệu hai vế gần bằng 0 nghĩa là nghiệm đáng tin. Đổi giá trị khởi đầu để tìm nghiệm khác."},
{c:"Giải tích",i:"∫",t:"Tính tích phân xác định",s:"Cận dưới, cận trên và hàm f(x)",k:"tich phan integral can dau cuoi dien tich",
 st:["Bấm {MENU}, chọn Tính toán.","Bấm phím {∫} để mở mẫu tích phân.","Nhập hàm f(x). Biến x gõ bằng {ALPHA} {)}.","Dùng {▶} {▼} để di chuyển sang ô cận dưới và cận trên, nhập từng cận.","Bấm {=} để xem kết quả, {S⇔D} để đổi dạng hiển thị."],
 tp:"Tích phân hàm lượng giác cần đặt đơn vị góc là Radian: bấm {SHIFT} {MENU} (SETUP) rồi chọn Đơn vị góc."},
{c:"Giải tích",i:"d/dx",t:"Đạo hàm tại một điểm",s:"Giá trị đạo hàm tại x = x₀",k:"dao ham derivative tiep tuyen he so goc",
 st:["Bấm {MENU}, chọn Tính toán.","Bấm {SHIFT} {∫} để mở mẫu d/dx.","Nhập hàm f(x) với biến x bằng {ALPHA} {)}.","Di chuyển sang ô điểm cần tính, nhập giá trị x₀.","Bấm {=} để xem f′(x₀)."],
 tp:"Kết quả là giá trị gần đúng. Với hàm không liên tục tại x₀, máy có thể báo lỗi."},
{c:"Giải tích",i:"f(x)",t:"Bảng giá trị hàm số",s:"Lập bảng x và f(x)",k:"bang gia tri table ham so khao sat do thi",
 st:["Bấm {MENU}, chọn Bảng giá trị.","Nhập hàm f(x) rồi bấm {=}. Hàm g(x) có thể bỏ trống, bấm {=} để qua.","Nhập Start (giá trị đầu), End (giá trị cuối) và Step (bước nhảy), mỗi giá trị kết thúc bằng {=}.","Bảng hiện ra, dùng {▼} {▲} cuộn xem."],
 tp:"Bảng tối đa khoảng 45 dòng. Chọn bước nhảy hợp lý để không vượt giới hạn."},
{c:"Số phức",i:"i",t:"Tính toán với số phức",s:"Cộng, nhân, mô-đun, liên hợp",k:"so phuc complex mo dun argument lien hop cuc i",
 st:["Bấm {MENU}, chọn Số phức.","Nhập số phức, ví dụ (2+3i)(1−i). Đơn vị ảo i gõ bằng phím {ENG}.","Bấm {=} để xem kết quả dạng a+bi.","Bấm {SHIFT} {2} để mở menu số phức, chọn Abs (mô-đun), Arg (argument) hoặc Conjg (liên hợp).","Đổi giữa dạng đại số và dạng cực bằng ►r∠θ và ►a+bi trong menu này."],
 tp:"Mô-đun của z là Abs(z). Nếu kết quả là số lẻ dài, bấm {S⇔D} để đổi dạng."},
{c:"Ma trận",i:"[ ]",t:"Nhập ma trận, tính định thức và nghịch đảo",s:"Tối đa 4×4, các phép + − × và det",k:"ma tran matrix dinh thuc det nghich dao nhan chuyen vi",
 st:["Bấm {MENU}, chọn Ma trận.","Chọn MatA (hoặc MatB, MatC), rồi chọn số hàng và số cột.","Nhập từng phần tử, mỗi phần tử kết thúc bằng {=}. Xong bấm {AC}.","Bấm {SHIFT} {4} để mở menu ma trận. Chọn Det để tính định thức, Trn để chuyển vị.","Tính nghịch đảo: chọn MatA rồi bấm {x⁻¹}, sau đó {=}. Nhân hai ma trận: MatA {×} MatB."],
 tp:"Ma trận chỉ có nghịch đảo khi định thức khác 0, nếu không máy báo lỗi Math ERROR."},
{c:"Thống kê",i:"x̄",t:"Thống kê một biến",s:"Trung bình, độ lệch chuẩn",k:"thong ke statistics trung binh do lech chuan sigma frequency tan so",
 st:["Bấm {MENU}, chọn Thống kê, rồi chọn 1 biến.","Nhập các giá trị vào cột x, mỗi giá trị kết thúc bằng {=}. Nếu có cột tần số FREQ, nhập thêm tần số.","Bấm {AC} khi nhập xong.","Bấm {OPTN} và chọn Tính 1 biến.","Xem x̄ (trung bình), σx (độ lệch chuẩn tổng thể), sx (độ lệch chuẩn mẫu) bằng {▼}."],
 tp:"Muốn hiện cột FREQ, bấm {SHIFT} {MENU} (SETUP), chọn Thống kê rồi bật Tần số."}
];
const $=s=>document.querySelector(s);
const norm=s=>s.replace(/[đĐ]/g,"d").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const key=s=>s.replace(/\{([^}]+)\}/g,"<kbd>$1</kbd>");
let cat="Tất cả",open=new Set();
D.forEach((d,n)=>{d.n=n;d.hay=norm([d.t,d.s,d.k,d.c].join(" "))});

function render(){
  const toks=norm($("#q").value).split(/\s+/).filter(Boolean);
  const res=D.filter(d=>(cat==="Tất cả"||d.c===cat)&&toks.every(t=>d.hay.includes(t)));
  $("#list").innerHTML=res.map(d=>`
  <article class="card${open.has(d.n)?" open":""}" data-n="${d.n}">
    <button class="head" aria-expanded="${open.has(d.n)}" aria-controls="b${d.n}">
      <span class="ico">${d.i}</span>
      <span class="txt"><b>${d.t}</b><span>${d.s}</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="body" id="b${d.n}"><div><div class="inner">
      <ol>${d.st.map(x=>`<li>${key(x)}</li>`).join("")}</ol>
      <div class="tip">${key(d.tp)}</div>
    </div></div></div>
  </article>`).join("");
  $("#empty").style.display=res.length?"none":"block";
  $("#count").textContent=res.length?res.length+" hướng dẫn":"";
  $("#clr").classList.toggle("on",!!$("#q").value);
}
$("#list").addEventListener("click",e=>{
  const h=e.target.closest(".head");if(!h)return;
  const card=h.parentElement,n=+card.dataset.n,on=!card.classList.contains("open");
  card.classList.toggle("open",on);h.setAttribute("aria-expanded",on);
  on?open.add(n):open.delete(n);
  if(on)setTimeout(()=>{const r=card.getBoundingClientRect();if(r.top<150)card.scrollIntoView({behavior:"smooth",block:"start"})},340);
});
$("#chips").innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}">${c}</button>`).join("");
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.textContent;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
});
$("#q").addEventListener("input",render);
$("#clr").addEventListener("click",()=>{$("#q").value="";render();$("#q").focus()});

/* Giao diện sáng/tối */
const root=document.documentElement;
function curDark(){const t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
try{const t=localStorage.getItem("c580-theme");if(t)root.dataset.theme=t}catch(e){}
$("#theme").addEventListener("click",()=>{
  const t=curDark()?"light":"dark";root.dataset.theme=t;
  try{localStorage.setItem("c580-theme",t)}catch(e){}
});
render();
</script>
</body>
</html>
