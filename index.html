<style>
/* ===== [SỬA 1] Tone Trắng - Xanh dương (bỏ dark mode) ===== */
:root{
  --bg:#f4f8ff; --surface:#ffffff; --surface2:#eaf2ff; --text:#0f1b2d; --muted:#4f5f78; --line:#d3e2fb;
  --accent:#1f6feb; --accent-d:#1553b8; --accent-soft:#e3eeff;
  --k-bg:#f7f9fc; --k-line:#c3d0e6; --k-text:#1c2a40;
  --k-shift:#fff1cf; --k-shift-t:#7a5410; --k-alpha:#fde2e2; --k-alpha-t:#8a2b2b; --k-menu:#dbe9ff; --k-menu-t:#17428a;
  --shadow:0 1px 2px rgba(31,111,235,.08),0 6px 18px rgba(31,111,235,.07);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:110px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
body.lock{overflow:hidden}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 -16px;padding:10px 16px 10px;border-bottom:2px solid var(--accent);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:36px;height:36px;flex:none;display:block}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--accent-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{min-width:0}
.sub{font-size:12px;color:var(--muted);margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.icon-btn:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.search{position:relative}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);display:grid}
.search .si .i{width:20px;height:20px}
.search input{width:100%;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:0 44px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.search input::placeholder{color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:10px;background:var(--surface2);color:var(--accent-d);cursor:pointer;display:none;font-size:16px}
.count{font-size:12.5px;color:var(--muted);margin:12px 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card.open{border-color:var(--accent)}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px;color:var(--accent-d);font-weight:700}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ht span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--accent);transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.card.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.pad{padding:2px 16px 16px}
.prob{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px;overflow-x:auto}
.fm{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:8px;overflow-x:auto;font-size:14px}
.fm small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.st{flex:1;min-width:0;line-height:2.05}
kbd{display:inline-block;font:600 12.5px/1 'Be Vietnam Pro',system-ui,sans-serif;background:var(--k-bg);color:var(--k-text);border:1px solid var(--k-line);border-bottom-width:3px;border-radius:8px;padding:5px 8px 4px;margin:0 1px;white-space:nowrap}
kbd.shift{background:var(--k-shift);color:var(--k-shift-t);border-color:var(--k-shift-t)}
kbd.alpha{background:var(--k-alpha);color:var(--k-alpha-t);border-color:var(--k-alpha-t)}
kbd.menu{background:var(--k-menu);color:var(--k-menu-t);border-color:var(--k-menu-t)}
.tip{margin-top:14px;border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--text)}
.tip b{color:var(--accent-d)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty big{display:block;font-size:34px;margin-bottom:6px}
footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
mjx-container{font-size:105%!important}
.fm{-webkit-overflow-scrolling:touch}
.ht b,.ht span{overflow-wrap:anywhere}
@media (max-width:380px){.app{padding:0 12px 40px}header{margin:0 -12px;padding:10px 12px 8px}.fm,.prob{font-size:13px}mjx-container{font-size:98%!important}}

/* ===== [THÊM] Tập bấm ===== */
[hidden]{display:none!important}
.pr{display:flex;flex-direction:column;gap:12px}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}
.pbar small{display:block;font-size:12px;color:var(--muted)}
.pbar b{color:var(--accent-d);font-size:15px}
.rand{width:100%;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px;cursor:pointer;box-shadow:0 6px 16px rgba(31,111,235,.28)}
.rand:active{transform:scale(.98)}
.ghost{border:1.5px solid var(--accent);background:#fff;color:var(--accent-d);border-radius:12px;font:inherit;font-weight:600;font-size:13.5px;padding:9px 12px;cursor:pointer}
.ghost:active{background:var(--accent-soft)}
.pcard{background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.pcard small{font-size:12.5px;color:var(--muted)}
.qt{font-size:16px;line-height:1.8;margin:6px 0 14px;overflow-x:auto}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pa{margin-top:12px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-weight:600;overflow-x:auto}
.ps{margin-top:14px}
/* ===== [THÊM 2] Drawer (menu 3 gạch) ===== */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--surface);z-index:50;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:6px 0 24px rgba(15,27,45,.18)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--accent);color:#fff;font-weight:700}
.dx{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer}
.dn{flex:1;overflow-y:auto;padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.dn h3{font-size:12.5px;color:var(--muted);margin:14px 6px 6px;font-weight:600}
.di{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14.5px;text-align:left;padding:11px 10px;border-radius:12px;cursor:pointer}
.di:active,.di.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600}

/* ===== [THÊM 4] Splash ===== */
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 60% at 50% 0%,#dcebff 0%,rgba(220,235,255,0) 70%),linear-gradient(180deg,#ffffff 0%,#f0f6ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash .logo{width:96px;height:96px;filter:drop-shadow(0 12px 22px rgba(31,111,235,.32))}
.splash h2{margin:0;font-size:28px;color:var(--accent-d);letter-spacing:-.02em}
.splash p{margin:0;color:var(--muted);max-width:280px}
.go{margin-top:10px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 20px rgba(31,111,235,.3)}
.go:active{transform:scale(.97)}
.bar{width:140px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);animation:fill 3.2s linear forwards}
@keyframes fill{to{width:100%}}
/* ===== [THÊM] Hệ thống icon SVG ===== */
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.clear{place-items:center}.clear .i{width:18px;height:18px}
.dx{display:grid;place-items:center}
.rand{display:flex;align-items:center;justify-content:center;gap:8px}
.dn h3{display:flex;align-items:center;gap:8px}.dn h3 .i{width:18px;height:18px;color:var(--accent)}
.di>.i:first-child{color:var(--accent)}.di .go2{margin-left:auto;width:18px;height:18px;color:var(--muted)}
.empty big .i{width:40px;height:40px;color:var(--accent)}
/* Splash tinh chỉnh */
.splash h2{font-size:30px;margin-top:6px}
.splash p{text-wrap:balance;max-width:300px}
.go{display:inline-flex;align-items:center;gap:8px}.go .i{width:20px;height:20px}
.splash>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.splash>:nth-child(2){animation-delay:.08s}.splash>:nth-child(3){animation-delay:.16s}.splash>:nth-child(4){animation-delay:.24s}.splash>:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.body,.chev,.drawer,.scrim,.splash{transition:none}.bar i{animation:none;width:100%}.splash>*{animation:none}}
</style>
</head>

  s:[`\\(u_n=u_1+(n-1)d\\).`,`\\(u_{10}=3+9\\cdot4=39\\).`]},
 {cat:'Cấp số',q:`Cấp số cộng có \\(u_1=2\\), \\(d=5\\). Tính \\(S_{20}\\).`,a:`990`,m:`Bấm \\(20\\times2+20\\times19\\div2\\times5\\) rồi [=].`,
  s:[`\\(S_n=n\\,u_1+\\dfrac{n(n-1)}{2}d\\).`,`\\(S_{20}=40+190\\cdot5=990\\).`]},
 {cat:'Cấp số',q:`Cấp số nhân có \\(u_1=2\\), \\(q=3\\). Tính \\(u_6\\).`,a:`486`,
  s:[`\\(u_n=u_1\\cdot q^{n-1}\\).`,`\\(u_6=2\\cdot3^5=2\\cdot243=486\\).`]},
 {cat:'Cấp số',q:`Cấp số nhân có \\(u_1=1\\), \\(q=2\\). Tính \\(S_{10}\\).`,a:`1023`,
  s:[`\\(S_n=\\dfrac{u_1(1-q^n)}{1-q}\\).`,`\\(S_{10}=\\dfrac{1-2^{10}}{1-2}=1023\\).`]},
 {cat:'Hình học - Thể tích',q:`Tính khoảng cách từ \\(M(1;2;3)\\) đến \\((\\alpha):2x-2y+z+1=0\\).`,a:`\\dfrac23`,m:`Bấm \\(|2-4+3+1|\\div\\sqrt{4+4+1}\\) rồi [=].`,
  s:[`\\(d=\\dfrac{|2\\cdot1-2\\cdot2+3+1|}{\\sqrt{2^2+(-2)^2+1^2}}\\).`,`\\(=\\dfrac{2}{3}\\).`]},
 {cat:'Hình học - Thể tích',q:`Tính \\(\\cos\\varphi\\), với \\(\\varphi\\) là góc giữa \\((\\alpha):x+2y+2z-3=0\\) và \\((\\beta):2x-y+2z+1=0\\).`,a:`\\dfrac49`,
  s:[`\\(\\vec n=(1;2;2)\\), \\(\\vec n'=(2;-1;2)\\).`,`\\(\\vec n\\cdot\\vec n'=2-2+4=4\\), \\(|\\vec n|=|\\vec n'|=3\\).`,`\\(\\cos\\varphi=\\dfrac{4}{3\\cdot3}=\\dfrac49\\).`]},
 {cat:'Hình học - Thể tích',q:`Khối chóp có đáy là hình vuông cạnh \\(3\\), chiều cao \\(4\\). Tính thể tích.`,a:`12`,
  s:[`\\(S_{\\text{đáy}}=3^2=9\\).`,`\\(V=\\dfrac13\\cdot4\\cdot9=12\\).`]},
 {cat:'Hình học - Thể tích',q:`Cho chóp \\(S.ABC\\). Lấy \\(A',B',C'\\) trên \\(SA,SB,SC\\) sao cho \\(SA'=\\frac12SA\\), \\(SB'=\\frac23SB\\), \\(SC'=\\frac12SC\\). Tính \\(\\dfrac{V_{S.A'B'C'}}{V_{S.ABC}}\\).`,a:`\\dfrac16`,
  s:[`Áp dụng \\(\\dfrac{V_{S.A'B'C'}}{V_{S.ABC}}=\\dfrac{SA'}{SA}\\cdot\\dfrac{SB'}{SB}\\cdot\\dfrac{SC'}{SC}\\).`,`\\(=\\dfrac12\\cdot\\dfrac23\\cdot\\dfrac12=\\dfrac16\\).`]},
 /* --- Giới hạn & Tiệm cận --- */
 {cat:'Giới hạn & Tiệm cận',q:`Tìm tiệm cận ngang của \\(y=\\dfrac{2x+1}{x-3}\\).`,a:`y=2`,m:`Bấm [CALC] nhập \\(10^{10}\\), rồi nhập \\(-10^{10}\\): cả hai ra xấp xỉ \\(2\\).`,
  s:[`Với \\(y=\\dfrac{ax+b}{cx+d}\\), tiệm cận ngang là \\(y=\\dfrac ac\\).`,`\\(\\dfrac21=2\\), vậy \\(y=2\\).`]},
 {cat:'Giới hạn & Tiệm cận',q:`Đồ thị \\(y=\\dfrac{x+1}{x^2-1}\\) có bao nhiêu đường tiệm cận?`,a:`2`,m:`Bấm [CALC] nhập \\(1{,}000001\\): ra số rất lớn. Nhập \\(-1{,}000001\\): ra giá trị hữu hạn.`,
  s:[`Rút gọn: \\(y=\\dfrac1{x-1}\\) với \\(x\\ne\\pm1\\).`,`\\(x=1\\) là tiệm cận đứng; \\(x=-1\\) không phải (nghiệm của cả tử và mẫu).`,`\\(\\displaystyle\\lim_{x\\to\\pm\\infty}y=0\\) nên \\(y=0\\) là tiệm cận ngang. Tổng cộng \\(2\\) đường.`]},
 /* --- Đạo hàm --- */
 {cat:'Đạo hàm',q:`Cho \\(f(x)=\\tan x\\). Tính \\(f'\\left(\\dfrac\\pi4\\right)\\).`,a:`2`,m:`Đặt Radian, bấm [SHIFT][∫] nhập \\(\\tan x\\) tại \\(x=\\dfrac\\pi4\\).`,
  s:[`\\(f'(x)=\\dfrac1{\\cos^2x}\\).`,`\\(f'\\left(\\frac\\pi4\\right)=\\dfrac1{(\\sqrt2/2)^2}=2\\).`]},
 /* --- Cấp số --- */
 {cat:'Cấp số',q:`Cấp số cộng có \\(u_3=7\\), \\(u_7=19\\). Tính \\(u_1\\).`,a:`1`,m:`Tính \\(d=(19-7)\\div4\\) rồi \\(u_1=7-2d\\).`,
  s:[`\\(u_7-u_3=4d=12\\), nên \\(d=3\\).`,`\\(u_1=u_3-2d=7-6=1\\).`]},
 {cat:'Cấp số',q:`Cấp số nhân có \\(u_2=6\\), \\(u_5=162\\). Tính công bội \\(q\\) (số thực).`,a:`3`,m:`Bấm \\(\\sqrt[3]{162\\div6}\\) rồi [=].`,
  s:[`\\(u_5=u_2\\cdot q^3\\Rightarrow q^3=\\dfrac{162}{6}=27\\).`,`Vậy \\(q=3\\).`]},
 /* --- Tích phân & Nguyên hàm --- */
 {cat:'Tích phân & Nguyên hàm',q:`Tính \\(\\displaystyle\\int_0^1(2x+1)\\,dx\\).`,a:`2`,m:`Bấm [∫], nhập cận \\(0\\), \\(1\\) và hàm \\(2x+1\\), bấm [=].`,
  s:[`Một nguyên hàm: \\(F(x)=x^2+x\\).`,`\\(F(1)-F(0)=2\\).`]},
 {cat:'Tích phân & Nguyên hàm',q:`Tính \\(\\displaystyle\\int_0^{\\pi/2}\\sin x\\,dx\\).`,a:`1`,m:`Đặt Radian, bấm [∫] nhập cận \\(0\\), \\(\\dfrac\\pi2\\) và hàm \\(\\sin x\\).`,
  s:[`Nguyên hàm của \\(\\sin x\\) là \\(-\\cos x\\).`,`\\(-\\cos\\frac\\pi2+\\cos0=0+1=1\\).`]},
 {cat:'Tích phân & Nguyên hàm',q:`Tính \\(\\displaystyle\\int_1^e\\dfrac1x\\,dx\\).`,a:`1`,m:`Bấm [∫], cận \\(1\\) và \\(2{,}718281828\\), hàm \\(\\dfrac1x\\).`,
  s:[`Nguyên hàm: \\(\\ln|x|\\).`,`\\(\\ln e-\\ln1=1\\).`]},
 {cat:'Tích phân & Nguyên hàm',q:`Hàm nào là một nguyên hàm của \\(f(x)=2xe^{x^2}\\)?<br>A. \\(e^{x^2}\\)  B. \\(x^2e^x\\)  C. \\(2e^{x^2}\\)  D. \\(e^{2x}\\)`,a:`\\text{A. }e^{x^2}`,m:`Bấm [SHIFT][∫] cho từng đáp án tại \\(x=1\\), so với \\(f(1)=2e\\approx5{,}4366\\). Đáp án nào bằng thì chọn.`,
  s:[`Nguyên hàm \\(F\\) phải thỏa \\(F'(x)=f(x)\\).`,`Đặt \\(t=x^2\\): \\(\\int2xe^{x^2}dx=\\int e^t\\,dt=e^{x^2}+C\\).`,`Kiểm tra: \\((e^{x^2})'=2xe^{x^2}\\), khớp đáp án A.`]},
 {cat:'Tích phân & Nguyên hàm',q:`Tính diện tích hình phẳng giới hạn bởi \\(y=x^2\\) và \\(y=x\\).`,a:`\\dfrac16`,m:`Bấm [∫] cận \\(0\\) đến \\(1\\) với \\(|x-x^2|\\): ra \\(0{,}1666\\).`,
  s:[`Giao điểm: \\(x^2=x\\Rightarrow x=0\\) hoặc \\(x=1\\).`,`Trên \\((0;1)\\): \\(x\\ge x^2\\).`,`\\(S=\\int_0^1(x-x^2)dx=\\dfrac12-\\dfrac13=\\dfrac16\\).`]},
 /* --- Mũ - Logarit --- */
 {cat:'Mũ - Logarit',q:`Giải phương trình \\(2^x=7\\).`,a:`x=\\log_27\\approx2{,}807`,m:`Bấm [SHIFT][CALC] (SOLVE) với \\(2^x-7\\), hoặc bấm \\(\\log7\\div\\log2\\).`,
  s:[`Logarit hóa: \\(x=\\log_27\\).`,`Đổi cơ số: \\(\\dfrac{\\log7}{\\log2}\\approx2{,}807\\).`]},
 {cat:'Mũ - Logarit',q:`Tính \\(\\log_28+\\log_39\\).`,a:`5`,m:`Dùng phím logarit cơ số bất kỳ, nhập cơ số rồi số; hoặc bấm \\(\\log8\\div\\log2+\\log9\\div\\log3\\).`,
  s:[`\\(\\log_28=3\\) vì \\(2^3=8\\).`,`\\(\\log_39=2\\) vì \\(3^2=9\\).`,`Tổng bằng \\(5\\).`]},
 {cat:'Mũ - Logarit',q:`Giải bất phương trình \\(\\log_2(x-1)\\ge3\\).`,a:`x\\ge9`,m:`Bấm [CALC] thử \\(x=9\\) (ra \\(3\\)) và \\(x=8\\) (ra nhỏ hơn \\(3\\)).`,
  s:[`Điều kiện: \\(x>1\\).`,`Cơ số \\(2>1\\): \\(x-1\\ge2^3=8\\).`,`Vậy \\(x\\ge9\\) (thỏa điều kiện).`]},
 {cat:'Mũ - Logarit',q:`Giải phương trình \\(3^{x+1}=27\\).`,a:`x=2`,
  s:[`\\(27=3^3\\) nên \\(x+1=3\\).`,`Vậy \\(x=2\\).`]},
 /* --- Lượng giác --- */
 {cat:'Lượng giác',q:`Tính \\(\\sin75^\\circ\\).`,a:`\\dfrac{\\sqrt6+\\sqrt2}{4}\\approx0{,}9659`,m:`Đặt máy ở đơn vị Độ (Degree), bấm \\(\\sin75\\) rồi [=].`,
  s:[`\\(75^\\circ=45^\\circ+30^\\circ\\).`,`\\(\\sin75^\\circ=\\sin45^\\circ\\cos30^\\circ+\\cos45^\\circ\\sin30^\\circ\\).`,`\\(=\\dfrac{\\sqrt2}{2}\\cdot\\dfrac{\\sqrt3}{2}+\\dfrac{\\sqrt2}{2}\\cdot\\dfrac12=\\dfrac{\\sqrt6+\\sqrt2}{4}\\).`]},
 {cat:'Lượng giác',q:`Cho \\(\\sin a=\\dfrac13\\). Tính \\(\\cos2a\\).`,a:`\\dfrac79`,m:`Bấm \\(1-2\\times(1\\div3)^2\\) rồi [=].`,
  s:[`\\(\\cos2a=1-2\\sin^2a\\).`,`\\(=1-2\\cdot\\dfrac19=\\dfrac79\\).`]},
 {cat:'Lượng giác',q:`Giải \\(\\sin x=\\dfrac12\\) trên \\([0;2\\pi]\\).`,a:`x=\\dfrac\\pi6;\\ x=\\dfrac{5\\pi}6`,m:`Đặt Radian, bấm [SHIFT][sin] nhập \\(0{,}5\\) được \\(\\dfrac\\pi6\\); nghiệm còn lại là \\(\\pi-\\dfrac\\pi6\\).`,
  s:[`\\(\\sin x=\\sin\\dfrac\\pi6\\).`,`\\(x=\\dfrac\\pi6+k2\\pi\\) hoặc \\(x=\\dfrac{5\\pi}6+k2\\pi\\).`,`Trên \\([0;2\\pi]\\) chọn \\(k=0\\): \\(x=\\dfrac\\pi6,\\ \\dfrac{5\\pi}6\\).`]},
 {cat:'Lượng giác',q:`Cho \\(\\tan a=\\dfrac12\\), \\(\\tan b=\\dfrac13\\). Tính \\(\\tan(a+b)\\).`,a:`1`,m:`Bấm \\((1\\div2+1\\div3)\\div(1-1\\div2\\times1\\div3)\\) rồi [=].`,
  s:[`\\(\\tan(a+b)=\\dfrac{\\tan a+\\tan b}{1-\\tan a\\tan b}\\).`,`\\(=\\dfrac{5/6}{1-1/6}=1\\).`]},
 /* --- Tổ hợp - Xác suất --- */
 {cat:'Tổ hợp - Xác suất',q:`Tính \\(C_{10}^3\\).`,a:`120`,m:`Bấm \\(10\\), [SHIFT][÷] (nCr), \\(3\\), [=].`,
  s:[`\\(C_n^k=\\dfrac{n!}{k!(n-k)!}\\).`,`\\(C_{10}^3=\\dfrac{10\\cdot9\\cdot8}{3!}=120\\).`]},
 {cat:'Tổ hợp - Xác suất',q:`Tính \\(A_5^3\\).`,a:`60`,m:`Bấm \\(5\\), [SHIFT][×] (nPr), \\(3\\), [=].`,
  s:[`\\(A_n^k=\\dfrac{n!}{(n-k)!}\\).`,`\\(A_5^3=5\\cdot4\\cdot3=60\\).`]},
 {cat:'Tổ hợp - Xác suất',q:`Chọn ngẫu nhiên \\(3\\) học sinh từ nhóm \\(6\\) nam và \\(4\\) nữ. Tính xác suất cả \\(3\\) là nam.`,a:`\\dfrac16`,m:`Bấm \\(6\\) [SHIFT][÷] \\(3\\) rồi chia cho \\(10\\) [SHIFT][÷] \\(3\\).`,
  s:[`Số cách chọn \\(3\\) trong \\(10\\) người: \\(C_{10}^3=120\\).`,`Số cách chọn \\(3\\) nam: \\(C_6^3=20\\).`,`Xác suất \\(=\\dfrac{20}{120}=\\dfrac16\\).`]},
 {cat:'Tổ hợp - Xác suất',q:`Có bao nhiêu cách xếp \\(5\\) người thành một hàng ngang?`,a:`120`,m:`Bấm \\(5\\), [x!], [=].`,
  s:[`Mỗi cách xếp là một hoán vị của \\(5\\) người.`,`\\(5!=120\\).`]},
 /* --- Hình học - Thể tích --- */
 {cat:'Hình học - Thể tích',q:`Lăng trụ đứng có đáy là tam giác đều cạnh \\(2\\), chiều cao \\(3\\). Tính thể tích.`,a:`3\\sqrt3`,m:`Bấm \\(3\\times\\sqrt3\\div4\\times2^2\\) rồi [=].`,
  s:[`Diện tích đáy: \\(S=\\dfrac{\\sqrt3}{4}\\cdot2^2=\\sqrt3\\).`,`\\(V=h\\cdot S=3\\sqrt3\\).`]}

function pickQ(pool){
  if(!pool.length) return null;
  const c = pool.length>1 ? pool.filter(p=>p!==cur) : pool;   /* không lặp lại câu vừa ra */
  return c[Math.floor(Math.random()*c.length)];
}
function practiceHTML(pool){
  if(!cur || !pool.includes(cur)) cur = pickQ(pool);
  const p = cur;
  return `<section class="pr">
    <div class="pbar"><div><small>Dạng bài</small><b>${cat===ALL_CAT?'Tất cả dạng':cat}</b></div><button class="ghost" data-act="menu">Đổi dạng</button></div>
    <button class="rand" data-act="rand">${ic('dice')}Random bài</button>
    <div class="pcard">
      <small>Đề bài · ${p.cat}</small>
      <div class="qt">${p.q}</div>
      ${p.m?`<div class="tip" style="margin:0 0 14px"><b>Gợi ý bấm máy:</b> ${kbd(p.m)}</div>`:''}
      <div class="acts"><button class="ghost" data-act="res">Hiện kết quả</button><button class="ghost" data-act="sol">Lời giải tự luận</button></div>
      <div class="pa" hidden>Đáp số: \\(${p.a}\\)</div>
      <ol class="steps ps" hidden>${p.s.map((x,i)=>`<li><span class="n">${i+1}</span><span class="st">${x}</span></li>`).join('')}</ol>
    </div>
  </section>`;
}
function act(b){
  const k = b.dataset.act;
  if(k==='menu') return setDrawer(true);
  if(k==='rand'){ cur = pickQ(items('practice').filter(d=>cat===ALL_CAT||d.cat===cat)); return render(); }
  const el = list.querySelector(k==='res'?'.pa':'.ps'); el.hidden = !el.hidden;
  b.textContent = k==='res' ? (el.hidden?'Hiện kết quả':'Ẩn kết quả') : (el.hidden?'Lời giải tự luận':'Ẩn lời giải');
}

function markDrawer(){
  document.querySelectorAll('#dn .di[data-t]').forEach(b=>
    b.classList.toggle('on', !q.value.trim() && b.dataset.t===tab && b.dataset.c===cat));
}

function render(){
  const tokens = norm(q.value).split(/\s+/).filter(Boolean);
  let pool;
  if(tokens.length){ pool = [...DATA,...THEORY].filter(d=>tokens.every(t=>d.hay.includes(t))); }   /* tìm kiếm quét cả 2 tab */
  else pool = items(tab).filter(d=>cat===ALL_CAT||d.cat===cat);
  clearBtn.style.display = q.value ? 'grid' : 'none';
  countEl.textContent = pool.length
    ? (tokens.length ? `${pool.length} kết quả` : `${cat===ALL_CAT ? TN[tab] : cat} · ${pool.length} ${tab==='practice'?'bài':'mục'}`)
    : '';
  markDrawer();
  list.innerHTML = (tab==='practice' && !tokens.length) ? practiceHTML(pool) : pool.length ? pool.map(cardHTML).join('') :
    `<div class="empty"><big>${ic('search')}</big>Không tìm thấy kết quả.<br>Thử từ khóa ngắn hơn, ví dụ “tích phân” hoặc “đạo hàm”.</div>`;
  typeset(list);
}

function go(t,c){
  tab=t; cat=c||ALL_CAT; q.value='';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

list.addEventListener('click',e=>{
  const a = e.target.closest('[data-act]'); if(a){ act(a); return; }
  const h = e.target.closest('.head'); if(!h) return;
  const card = h.parentElement, open = !card.classList.contains('open');
  card.classList.toggle('open',open);
  h.setAttribute('aria-expanded',open);
  if(open) setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),320);
});
let tm; q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120)});
clearBtn.addEventListener('click',()=>{q.value='';render();q.focus()});

/* ===== [THÊM 2] Drawer ===== */
function buildDrawer(){
  const sec = (t,label) => `<h3>${ic(SECI[t])}${label}</h3>` + catsOf(t).map(c=>`<button class="di" data-t="${t}" data-c="${c}">${c===ALL_CAT?'Tất cả':c}${ic('chevR','go2')}</button>`).join('');
  $('#dn').innerHTML = `<button class="di" data-s="1">${ic('search')}Tìm kiếm</button>` + sec('casio','Bấm máy Casio') + sec('theory','Lý thuyết') + sec('practice','Tập bấm');
}
const setDrawer = o => { document.body.classList.toggle('dopen',o); document.body.classList.toggle('lock',o); };
$('#burger').addEventListener('click',()=>setDrawer(true));
$('#dx').addEventListener('click',()=>setDrawer(false));
$('#scrim').addEventListener('click',()=>setDrawer(false));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') setDrawer(false); });
$('#dn').addEventListener('click',e=>{
  const b = e.target.closest('.di'); if(!b) return;
  setDrawer(false);
  if(b.dataset.s){ setTimeout(()=>q.focus(),300); return; }
  go(b.dataset.t,b.dataset.c);
});

/* ===== [THÊM 4] Splash: tự ẩn sau 3,2s hoặc khi bấm; chỉ hiện 1 lần/phiên ===== */
(function(){
  const sp = $('#splash');
  let seen = false;
  try{ seen = sessionStorage.getItem('cm580-splash')==='1'; }catch(e){}
  if(seen){ sp.remove(); return; }
  let done = false;
  const close = () => {
    if(done) return; done = true;
    sp.classList.add('hide');
    try{ sessionStorage.setItem('cm580-splash','1'); }catch(e){}
    setTimeout(()=>sp.remove(),600);
  };
  $('#go').addEventListener('click',close);
  sp.addEventListener('click',close);
  setTimeout(close,3200);
})();

buildDrawer(); render();
</script>
</body>
</html>
