<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121617; --surface:#1b2122; --surface2:#242c2d; --text:#e8efee; --muted:#8c9a9d; --line:#2a3335;

    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121617; --surface:#1b2122; --surface2:#242c2d; --text:#e8efee; --muted:#8c9a9d; --line:#2a3335;
  --accent:#58c4b3; --accent-soft:#1d3532;
  --k-bg:#2a3234; --k-line:#3a4547; --k-text:#e4ecea;
  --k-shift:#4a3a17; --k-shift-t:#f3d595; --k-alpha:#4d2a2a; --k-alpha-t:#f5b9b9; --k-menu:#203549; --k-menu-t:#a9cdf0;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:150px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin-top:-2px}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.95)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 44px 0 44px;font:inherit;font-size:15px;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::placeholder{color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:10px;background:var(--surface2);color:var(--muted);cursor:pointer;display:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12.5px;color:var(--muted);margin:6px 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ht span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--muted);transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.card.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.pad{padding:2px 16px 16px}
.prob{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px;overflow-x:auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.st{flex:1;min-width:0;line-height:2.05}
kbd{display:inline-block;font:600 12.5px/1 'Be Vietnam Pro',system-ui,sans-serif;background:var(--k-bg);color:var(--k-text);border:1px solid var(--k-line);border-bottom-width:3px;border-radius:8px;padding:5px 8px 4px;margin:0 1px;white-space:nowrap}
kbd.shift{background:var(--k-shift);color:var(--k-shift-t);border-color:var(--k-shift-t)}
kbd.alpha{background:var(--k-alpha);color:var(--k-alpha-t);border-color:var(--k-alpha-t)}
kbd.menu{background:var(--k-menu);color:var(--k-menu-t);border-color:var(--k-menu-t)}
.tip{margin-top:14px;border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--text)}
.tip b{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty big{display:block;font-size:34px;margin-bottom:6px}
footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
mjx-container{font-size:105%!important}
@media (prefers-reduced-motion:reduce){.body,.chev{transition:none}}
</style>
</head>

  const u = t.toUpperCase();
  if(u==='SHIFT') return 'shift';
  if(u==='ALPHA') return 'alpha';
  if(u==='MENU'||u==='OPTN') return 'menu';
  return '';
}
const kbd = s => s.replace(/\[([^\]]+)\]/g,(m,t)=>`<kbd class="${keyClass(t)}">${t}</kbd>`);

DATA.forEach((d,i)=>{
  d.id = i;
  d.hay = norm(strip(d.title+' '+d.sub+' '+d.cat+' '+d.tags+' '+d.math+' '+d.steps.join(' ')+' '+d.tip).replace(/\[|\]/g,' '));
});

const cats = ['Tất cả',...new Set(DATA.map(d=>d.cat))];
chipsEl.innerHTML = cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
chipsEl.addEventListener('click',e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.c;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===cat));
  render();
});

function cardHTML(d){
  return `<article class="card" id="c${d.id}" data-id="${d.id}">
    <button class="head" aria-expanded="false">
      <div class="ico">${d.ico}</div>
      <div class="ht"><b>${d.title}</b><span>${d.sub}</span></div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="body"><div class="inner"><div class="pad">
      <div class="prob">${d.math}</div>
      <ol class="steps">${d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span class="st">${kbd(s)}</span></li>`).join('')}</ol>
      <div class="tip"><b>Mẹo:</b> ${d.tip}</div>
    </div></div></div>
  </article>`;
}

function typeset(el){
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(el?[el]:undefined).catch(()=>{}); }
  else setTimeout(()=>typeset(el),300);
}

function render(){
  const tokens = norm(q.value).split(/\s+/).filter(Boolean);
  const res = DATA.filter(d=>(cat==='Tất cả'||d.cat===cat) && tokens.every(t=>d.hay.includes(t)));
  clearBtn.style.display = q.value ? 'block' : 'none';
  countEl.textContent = res.length ? `${res.length} hướng dẫn` : '';
  list.innerHTML = res.length ? res.map(cardHTML).join('') :
    `<div class="empty"><big>🔍</big>Không tìm thấy kết quả.<br>Thử từ khóa ngắn hơn, ví dụ “tích phân” hoặc “bậc 3”.</div>`;
  typeset(list);
}

list.addEventListener('click',e=>{
  const h = e.target.closest('.head'); if(!h) return;
  const card = h.parentElement, open = !card.classList.contains('open');
  card.classList.toggle('open',open);
  h.setAttribute('aria-expanded',open);
  if(open) setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),320);
});

let t; q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,120)});
clearBtn.addEventListener('click',()=>{q.value='';render();q.focus()});

$('#theme').addEventListener('click',()=>{
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try{localStorage.setItem('cm580-theme',root.dataset.theme)}catch(e){}
});
try{const s=localStorage.getItem('cm580-theme'); if(s) document.documentElement.dataset.theme=s}catch(e){}

render();
</script>
</body>
</html>
