<style>
/* ===== [SỬA 1] Tone Trắng - Xanh dương (bỏ dark mode) ===== */
:root{
  --bg:#f4f8ff; --surface:#ffffff; --surface2:#eaf2ff; --text:#0f1b2d; --muted:#4f5f78; --line:#d3e2fb;
  --accent:#1f6feb; --accent-d:#1553b8; --accent-soft:#e3eeff;
  --k-bg:#f7f9fc; --k-line:#c3d0e6; --k-text:#1c2a40;
  --k-shift:#fff1cf; --k-shift-t:#7a5410; --k-alpha:#fde2e2; --k-alpha-t:#8a2b2b; --k-menu:#dbe9ff; --k-menu-t:#17428a;
  --shadow:0 1px 2px rgba(31,111,235,.08),0 6px 18px rgba(31,111,235,.07);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:190px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
body.lock{overflow:hidden}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 -16px;padding:12px 16px 10px;border-bottom:2px solid var(--accent);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--accent-d)}
.sub{font-size:12px;color:var(--muted);margin-top:-2px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.icon-btn:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent)}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:0 44px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.search input::placeholder{color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:10px;background:var(--surface2);color:var(--accent-d);cursor:pointer;display:none;font-size:16px}
/* [THÊM 3] Tab Bấm máy / Lý thuyết */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:14px;padding:4px;margin-top:10px}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px;border-radius:11px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent-d);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12.5px;color:var(--muted);margin:14px 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card.open{border-color:var(--accent)}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px;color:var(--accent-d);font-weight:700}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ht span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--accent);transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.card.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.pad{padding:2px 16px 16px}
.prob{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px;overflow-x:auto}
.fm{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:8px;overflow-x:auto;font-size:14px}
.fm small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.st{flex:1;min-width:0;line-height:2.05}
kbd{display:inline-block;font:600 12.5px/1 'Be Vietnam Pro',system-ui,sans-serif;background:var(--k-bg);color:var(--k-text);border:1px solid var(--k-line);border-bottom-width:3px;border-radius:8px;padding:5px 8px 4px;margin:0 1px;white-space:nowrap}
kbd.shift{background:var(--k-shift);color:var(--k-shift-t);border-color:var(--k-shift-t)}
kbd.alpha{background:var(--k-alpha);color:var(--k-alpha-t);border-color:var(--k-alpha-t)}
kbd.menu{background:var(--k-menu);color:var(--k-menu-t);border-color:var(--k-menu-t)}
.tip{margin-top:14px;border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--text)}
.tip b{color:var(--accent-d)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty big{display:block;font-size:34px;margin-bottom:6px}
footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
mjx-container{font-size:105%!important}

/* ===== [THÊM 2] Drawer (menu 3 gạch) ===== */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--surface);z-index:50;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:6px 0 24px rgba(15,27,45,.18)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--accent);color:#fff;font-weight:700}
.dx{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer}
.dn{flex:1;overflow-y:auto;padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.dn h3{font-size:12.5px;color:var(--muted);margin:14px 6px 6px;font-weight:600}
.di{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14.5px;text-align:left;padding:11px 10px;border-radius:12px;cursor:pointer}
.di:active,.di.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600}

/* ===== [THÊM 4] Splash ===== */
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#ffffff 0%,#e3eeff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash .logo{width:84px;height:84px;border-radius:26px;font-size:30px;box-shadow:0 10px 30px rgba(31,111,235,.35)}
.splash h2{margin:0;font-size:28px;color:var(--accent-d);letter-spacing:-.02em}
.splash p{margin:0;color:var(--muted);max-width:280px}
.go{margin-top:10px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 20px rgba(31,111,235,.3)}
.go:active{transform:scale(.97)}
.bar{width:140px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);animation:fill 3.2s linear forwards}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.body,.chev,.drawer,.scrim,.splash{transition:none}.bar i{animation:none;width:100%}}
</style>
</head>

/* ===== LOGIC ===== */
const $ = s => document.querySelector(s);
const list = $('#list'), q = $('#q'), chipsEl = $('#chips'), countEl = $('#count'), clearBtn = $('#clear');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase();
const strip = s => s.replace(/\\\(|\\\)/g,' ').replace(/\\[a-zA-Z]+/g,' ').replace(/[{}^_$]/g,' ');
const ALL_CAT = 'Tất cả';
let tab = 'casio', cat = ALL_CAT;

function keyClass(t){
  const u = t.toUpperCase();
  if(u==='SHIFT') return 'shift';
  if(u==='ALPHA') return 'alpha';
  if(u==='MENU'||u==='OPTN') return 'menu';
  return '';
}
const kbd = s => s.replace(/\[([^\]]+)\]/g,(m,t)=>`<kbd class="${keyClass(t)}">${t}</kbd>`);
const fm = ([l,x]) => `<div class="fm">${l?`<small>${l}</small>`:''}\\(\\displaystyle ${x}\\)</div>`;

DATA.forEach((d,i)=>{ d.id='c'+i; d.tab='casio'; });
THEORY.forEach((d,i)=>{ d.id='t'+i; d.tab='theory'; });
[...DATA,...THEORY].forEach(d=>{
  const extra = (d.math||'')+' '+(d.f?d.f.map(x=>x[0]+' '+x[1]).join(' '):'')+' '+(d.steps?d.steps.join(' '):'')+' '+(d.tip||'');
  d.hay = norm(strip(d.title+' '+d.sub+' '+d.cat+' '+d.tags+' '+extra).replace(/\[|\]/g,' '));
});
const items = t => t==='casio' ? DATA : THEORY;
const catsOf = t => [ALL_CAT,...new Set(items(t).map(d=>d.cat))];

function cardHTML(d){
  return `<article class="card" id="${d.id}">
    <button class="head" aria-expanded="false">
      <div class="ico">${d.ico}</div>
      <div class="ht"><b>${d.title}</b><span>${d.sub}</span></div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="body"><div class="inner"><div class="pad">
      ${d.math?`<div class="prob">${d.math}</div>`:''}
      ${d.f?d.f.map(fm).join(''):''}
      ${d.steps?`<ol class="steps">${d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span class="st">${kbd(s)}</span></li>`).join('')}</ol>`:''}
      ${d.tip?`<div class="tip"><b>Mẹo:</b> ${d.tip}</div>`:''}
    </div></div></div>
  </article>`;
}

function typeset(el){
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(el?[el]:undefined).catch(()=>{}); }
  else setTimeout(()=>typeset(el),300);
}

function renderChips(){
  chipsEl.innerHTML = catsOf(tab).map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
}

function render(){
  const tokens = norm(q.value).split(/\s+/).filter(Boolean);
  let pool;
  if(tokens.length){ pool = [...DATA,...THEORY].filter(d=>tokens.every(t=>d.hay.includes(t))); }   /* tìm kiếm quét cả 2 tab */
  else pool = items(tab).filter(d=>cat===ALL_CAT||d.cat===cat);
  clearBtn.style.display = q.value ? 'block' : 'none';
  countEl.textContent = pool.length ? `${pool.length} ${tokens.length?'kết quả':'mục'}` : '';
  list.innerHTML = pool.length ? pool.map(cardHTML).join('') :
    `<div class="empty"><big>🔍</big>Không tìm thấy kết quả.<br>Thử từ khóa ngắn hơn, ví dụ “tích phân” hoặc “đạo hàm”.</div>`;
  typeset(list);
}

function go(t,c){
  tab=t; cat=c||ALL_CAT; q.value='';
  renderTabs(); renderChips(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

chipsEl.addEventListener('click',e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.c; renderChips(); render();
});
document.querySelector('.tabs').addEventListener('click',e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  go(b.dataset.t);
});
list.addEventListener('click',e=>{
  const h = e.target.closest('.head'); if(!h) return;
  const card = h.parentElement, open = !card.classList.contains('open');
  card.classList.toggle('open',open);
  h.setAttribute('aria-expanded',open);
  if(open) setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),320);
});
let tm; q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120)});
clearBtn.addEventListener('click',()=>{q.value='';render();q.focus()});

/* ===== [THÊM 2] Drawer ===== */
function buildDrawer(){
  const sec = (t,label) => `<h3>${label}</h3>` + catsOf(t).map(c=>`<button class="di" data-t="${t}" data-c="${c}">${c===ALL_CAT?'📚 Tất cả':c}</button>`).join('');
  $('#dn').innerHTML = `<button class="di" data-s="1">🔍 Tìm kiếm</button>` + sec('casio','Bấm máy Casio') + sec('theory','Lý thuyết');
}
const setDrawer = o => { document.body.classList.toggle('dopen',o); document.body.classList.toggle('lock',o); };
$('#burger').addEventListener('click',()=>setDrawer(true));
$('#dx').addEventListener('click',()=>setDrawer(false));
$('#scrim').addEventListener('click',()=>setDrawer(false));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') setDrawer(false); });
$('#dn').addEventListener('click',e=>{
  const b = e.target.closest('.di'); if(!b) return;
  setDrawer(false);
  if(b.dataset.s){ setTimeout(()=>q.focus(),300); return; }
  go(b.dataset.t,b.dataset.c);
});

/* ===== [THÊM 4] Splash: tự ẩn sau 3,2s hoặc khi bấm; chỉ hiện 1 lần/phiên ===== */
(function(){
  const sp = $('#splash');
  let seen = false;
  try{ seen = sessionStorage.getItem('cm580-splash')==='1'; }catch(e){}
  if(seen){ sp.remove(); return; }
  let done = false;
  const close = () => {
    if(done) return; done = true;
    sp.classList.add('hide');
    try{ sessionStorage.setItem('cm580-splash','1'); }catch(e){}
    setTimeout(()=>sp.remove(),600);
  };
  $('#go').addEventListener('click',close);
  sp.addEventListener('click',close);
  setTimeout(close,3200);
})();

buildDrawer(); renderChips(); render();
</script>
